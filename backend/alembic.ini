[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the "created" timestamp embedded in migration files
# (leave unset to use the system's local time)
# timezone =

# Max length of the "slug" field appended to migration filenames
truncate_slug_length = 40

# sqlalchemy.url is deliberately left blank. The real PostgreSQL connection
# string comes from the DATABASE_URL environment variable, read and set at
# runtime in alembic/env.py — never hardcoded here.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured for this project.

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
